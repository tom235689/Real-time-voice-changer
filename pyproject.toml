[project]
name = "rtvc"
version = "0.1.0"
description = "Real-time RVC voice changer for Zoom / Google Meet (CPU-only target)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26",
    "sounddevice>=0.4.6",
    "soxr>=0.3.7",
    "onnxruntime>=1.18",
    "openvino>=2026",
]

[project.optional-dependencies]
# Desktop GUI (M5).
gui = ["PySide6>=6.7"]
# Offline model preparation: PyTorch checkpoint -> ONNX -> int8. Not needed at runtime.
tools = [
    "onnx>=1.16",
    "onnxscript>=0.1",
    "torch>=2.2",
    "transformers>=4.40",
    "scipy>=1.17.1",
]

[project.scripts]
rtvc = "rtvc.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "py-spy>=0.3.14",
    "librosa>=0.11.0",
]

[tool.ruff]
line-length = 110
target-version = "py311"
# Vendored upstream RVC code is kept verbatim (MIT, third_party/rvc/README.md).
extend-exclude = ["third_party", "models"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rtvc"]
